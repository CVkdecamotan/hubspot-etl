name: Calls 48h - Refresh Calls Data

on:
  schedule:
    - cron: "0 7 * * *" # Midnight America/Phoenix (UTC-07:00)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hubspot-calls-48h-preview
  cancel-in-progress: false

jobs:
  validate-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Google authentication dependency
        run: pip install google-auth==2.36.0 requests==2.32.5
      - name: Fetch, validate, replace Calls Data and verify
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_TAB: "Calls Data"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          python - <<'PY'
          """Replace the Calls Data snapshot after fetching and validating all calls."""
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          
          TZ = ZoneInfo("America/Phoenix")
          HEADERS = ["Activity assigned to", "Activity type", "Activity Date", "HubSpot team name"]
          
          
          def request_json(url, token, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              for attempt in range(6):
                  request = urllib.request.Request(url, data=data, headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=60) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 5:
                          # Never echo response bodies, which may contain CRM data.
                          raise RuntimeError("API request failed with HTTP " + str(exc.code)) from None
                      retry_after = exc.headers.get("Retry-After", "")
                      delay = float(retry_after) if retry_after.isdigit() else 2 ** attempt
                      time.sleep(min(delay, 120))
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 5:
                          raise RuntimeError("API request failed after network retries") from None
                      time.sleep(2 ** attempt)
          
          
          def reporting_window(created_at):
              anchor = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              end = anchor.astimezone(TZ).replace(hour=0, minute=0, second=0, microsecond=0)
              end = end.astimezone(timezone.utc)
              return end - timedelta(hours=48), end
          
          
          def parse_date(value):
              text = str(value)
              if text.isdigit():
                  return datetime.fromtimestamp(int(text) / 1000, timezone.utc)
              return datetime.fromisoformat(text.replace("Z", "+00:00")).astimezone(timezone.utc)
          
          
          def paged(api, path):
              result = []
              seen = set()
              while True:
                  response = api(path)
                  result.extend(response.get("results", []))
                  after = response.get("paging", {}).get("next", {}).get("after")
                  if after is None:
                      return result
                  if str(after) in seen:
                      raise RuntimeError("Repeated pagination cursor")
                  seen.add(str(after))
                  separator = "&" if "?" in path else "?"
                  # Replace the previous cursor instead of adding duplicate query keys.
                  base = path.split("&after=")[0].split("?after=")[0]
                  path = base + ("&" if "?" in base else "?") + "after=" + urllib.parse.quote(str(after))
          
          
          def fetch_calls(api, start_ms, end_ms, properties):
              def search(after=None):
                  payload = {
                      "filterGroups": [{"filters": [
                          {"propertyName": "hs_timestamp", "operator": "GTE", "value": str(start_ms)},
                          {"propertyName": "hs_timestamp", "operator": "LT", "value": str(end_ms)},
                      ]}],
                      "properties": properties,
                      "sorts": ["hs_timestamp"],
                      "limit": 200,
                  }
                  if after is not None:
                      payload["after"] = after
                  # Keep below the CRM search request rate limit.
                  time.sleep(0.25)
                  return api("/crm/v3/objects/calls/search", payload)
          
              response = search()
              if response.get("total", 0) >= 10000:
                  midpoint = (start_ms + end_ms) // 2
                  if midpoint <= start_ms:
                      raise RuntimeError("Call volume exceeds the search limit at millisecond granularity")
                  return (fetch_calls(api, start_ms, midpoint, properties)
                          + fetch_calls(api, midpoint, end_ms, properties))
              records = list(response.get("results", []))
              expected = response.get("total", len(records))
              seen = set()
              while True:
                  after = response.get("paging", {}).get("next", {}).get("after")
                  if after is None:
                      break
                  if str(after) in seen:
                      raise RuntimeError("Repeated calls pagination cursor")
                  seen.add(str(after))
                  response = search(after)
                  records.extend(response.get("results", []))
              if len(records) != expected:
                  raise RuntimeError("Calls changed during pagination; retry the snapshot")
              return records
          
          
          def normalize(records, owners, team_names, start, end):
              rows = []
              seen = set()
              issues = set()
              for call in records:
                  call_id = str(call["id"])
                  if call_id in seen:
                      raise RuntimeError("Duplicate call ID during pagination; retry the snapshot")
                  seen.add(call_id)
                  prop = call.get("properties", {})
                  activity_date = parse_date(prop["hs_timestamp"])
                  if not start <= activity_date < end:
                      raise RuntimeError("Call Activity Date is outside the reporting window")
                  owner_id = str(prop.get("hubspot_owner_id") or "")
                  owner = owners.get(owner_id)
                  assignee = "Unassigned" if not owner_id else ""
                  if owner:
                      assignee = (owner.get("firstName", "") + " " + owner.get("lastName", "")).strip()
                      assignee = assignee or owner.get("email", "") or owner_id
                  elif owner_id:
                      issues.add("Unresolved activity assignee")
                  team_id = str(prop.get("hubspot_team_id") or "")
                  team = team_names.get(team_id, "") if team_id else ""
                  if team_id and not team:
                      issues.add("Unresolved call HubSpot team ID")
                  elif not team_id and owner:
                      # Explicit current-owner fallback; do not imply historical team membership.
                      primary = [item for item in owner.get("teams", []) if item.get("primary")]
                      if len(primary) == 1:
                          team = primary[0].get("name", "")
                          issues.add("Team derived from assignee current primary team; review mapping")
                      elif owner.get("teams"):
                          issues.add("Ambiguous assignee primary team")
                  rows.append((call_id, [assignee, "Call", activity_date.astimezone(TZ).isoformat(), team]))
              rows.sort(key=lambda item: (item[1][2], item[0]))
              return [row for _, row in rows], sorted(issues)
          
          
          
          def build_sheet_update(sheet, rows):
              grid = sheet["gridProperties"]
              needed = len(rows) + 1
              total_rows = max(grid["rowCount"], needed)
              sheet_id = sheet["sheetId"]
              requests = []
              if needed > grid["rowCount"]:
                  requests.append({"appendDimension": {"sheetId": sheet_id, "dimension": "ROWS",
                                                       "length": needed - grid["rowCount"]}})
              if grid["columnCount"] < 4:
                  requests.append({"appendDimension": {"sheetId": sheet_id, "dimension": "COLUMNS",
                                                       "length": 4 - grid["columnCount"]}})
              data = [{"values": [{"userEnteredValue": {"stringValue": h}} for h in HEADERS]}]
              epoch = datetime(1899, 12, 30)
              for row in rows:
                  local = parse_date(row[2]).astimezone(TZ).replace(tzinfo=None)
                  date_serial = (local - epoch).total_seconds() / 86400
                  data.append({"values": [
                      {"userEnteredValue": {"numberValue": date_serial}} if index == 2
                      else {"userEnteredValue": {"stringValue": str(value)}}
                      for index, value in enumerate(row)]})
              # An explicit range clears stale trailing values in A:D within this same atomic request.
              requests.append({"updateCells": {
                  "range": {"sheetId": sheet_id, "startRowIndex": 0, "endRowIndex": total_rows,
                            "startColumnIndex": 0, "endColumnIndex": 4},
                  "rows": data, "fields": "userEnteredValue"}})
              requests.append({"repeatCell": {
                  "range": {"sheetId": sheet_id, "startRowIndex": 1, "endRowIndex": total_rows,
                            "startColumnIndex": 2, "endColumnIndex": 3},
                  "cell": {"userEnteredFormat": {"numberFormat": {
                      "type": "DATE_TIME", "pattern": "yyyy-mm-dd hh:mm:ss"}}},
                  "fields": "userEnteredFormat.numberFormat"}})
              requests.append({"repeatCell": {
                  "range": {"sheetId": sheet_id, "startRowIndex": 0, "endRowIndex": 1,
                            "startColumnIndex": 0, "endColumnIndex": 4},
                  "cell": {"userEnteredFormat": {"textFormat": {"bold": True}}},
                  "fields": "userEnteredFormat.textFormat.bold"}})
              requests.append({"updateSheetProperties": {
                  "properties": {"sheetId": sheet_id, "gridProperties": {"frozenRowCount": 1}},
                  "fields": "gridProperties.frozenRowCount"}})
              for column, width in enumerate([230, 120, 190, 240]):
                  requests.append({"updateDimensionProperties": {
                      "range": {"sheetId": sheet_id, "dimension": "COLUMNS",
                                "startIndex": column, "endIndex": column + 1},
                      "properties": {"pixelSize": width}, "fields": "pixelSize"}})
              return {"requests": requests}
          
          
          def write_snapshot(rows):
              print("Stage: authenticate existing Google service account")
              from google.auth.transport.requests import Request
              from google.oauth2.service_account import Credentials
              info = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "")
              try:
                  info = json.loads(info)
              except json.JSONDecodeError:
                  with open(info, encoding="utf-8") as stream:
                      info = json.load(stream)
              credentials = Credentials.from_service_account_info(
                  info, scopes=["https://www.googleapis.com/auth/spreadsheets"])
              credentials.refresh(Request())
              base = "https://sheets.googleapis.com/v4/spreadsheets/" + urllib.parse.quote(
                  os.environ["GOOGLE_SHEET_ID"], safe="")
              print("Stage: locate existing Calls Data tab")
              metadata = request_json(base + "?fields=sheets.properties", credentials.token)
              matches = [s["properties"] for s in metadata["sheets"]
                         if s["properties"]["title"] == "Calls Data"]
              if len(matches) != 1:
                  raise RuntimeError("Expected existing Calls Data tab was not found")
              batch = build_sheet_update(matches[0], rows)
              if len(json.dumps(batch).encode()) > 8_000_000:
                  raise RuntimeError("Snapshot requires staging because its payload exceeds the direct-write limit")
              print("Stage: atomic Calls Data replacement")
              request_json(base + ":batchUpdate", credentials.token, batch)
              # Read back and compare all four columns, including trailing blank rows.
              print("Stage: verify written snapshot")
              result = request_json(base + "/values/" + urllib.parse.quote("'Calls Data'!A:D", safe="")
                                    + "?valueRenderOption=UNFORMATTED_VALUE", credentials.token)
              actual = [row + [""] * (4 - len(row)) for row in result.get("values", [])]
              expected = [[cell["userEnteredValue"].get("stringValue",
                              cell["userEnteredValue"].get("numberValue")) for cell in row["values"]]
                          for row in batch["requests"][next(i for i,r in enumerate(batch["requests"]) if "updateCells" in r)]
                              ["updateCells"]["rows"]]
              if len(actual) != len(expected):
                  raise RuntimeError("Sheets readback row count differs from written snapshot")
              for a, e in zip(actual, expected):
                  for index in range(4):
                      if index == 2 and isinstance(e[index], (int, float)):
                          if not isinstance(a[index], (int, float)) or abs(a[index] - e[index]) > 1e-8:
                              raise RuntimeError("Sheets date readback differs")
                      elif a[index] != e[index]:
                          raise RuntimeError("Sheets readback differs from written snapshot")
          
          
          def main():
              hubspot_token = os.environ.get("HUBSPOT_ACCESS_TOKEN")
              if not hubspot_token:
                  raise RuntimeError("Missing HUBSPOT_ACCESS_TOKEN repository secret")
              if not os.environ.get("GOOGLE_SHEET_ID"):
                  raise RuntimeError("Missing existing GOOGLE_SHEET_ID repository secret")
              if os.environ.get("GOOGLE_SHEET_TAB") != "Calls Data":
                  raise RuntimeError("Unexpected destination tab")
              # The run creation timestamp stays fixed on reruns, including after midnight.
              run = request_json(
                  "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"], os.environ["GH_TOKEN"])
              start, end = reporting_window(run["created_at"])
              def api(path, payload=None):
                  return request_json("https://api.hubapi.com" + path, hubspot_token, payload)
              schema = {p["name"]: p for p in api("/crm/v3/properties/calls")["results"]}
              properties = ["hs_timestamp", "hubspot_owner_id"]
              if any(name not in schema for name in properties):
                  raise RuntimeError("Required call Activity Date or assignee property unavailable")
              if "hubspot_team_id" in schema:
                  properties.append("hubspot_team_id")
              owner_list = paged(api, "/crm/v3/owners?limit=100&archived=false")
              owner_list += paged(api, "/crm/v3/owners?limit=100&archived=true")
              owners = {str(owner["id"]): owner for owner in owner_list}
              teams = {str(t["id"]): t["name"] for owner in owner_list for t in owner.get("teams", [])}
              for option in schema.get("hubspot_team_id", {}).get("options", []):
                  teams[str(option["value"])] = option["label"]
              print("Stage: retrieve calls within Activity Date window")
              calls = fetch_calls(api, int(start.timestamp() * 1000), int(end.timestamp() * 1000), properties)
              rows, issues = normalize(calls, owners, teams, start, end)
              if any(issue != "Team derived from assignee current primary team; review mapping" for issue in issues):
                  raise RuntimeError("Unresolved owner or team mapping; existing sheet preserved")
              write_snapshot(rows)
              # No CRM rows, counts, or owner/team names in public logs/artifacts.
              summary = ["## Calls snapshot written and verified",
                         "Columns: " + " | ".join(HEADERS),
                         "Scope: all assignees and teams; call objects only.",
                         "Timezone: America/Phoenix; preceding 48 hours ending at run-date midnight.",
                         "Destination: existing GOOGLE_SHEET_ID spreadsheet; tab Calls Data.",
                         "Google Sheets: Calls Data replaced and readback verified.",
                         "CRM record data and counts are not published."]
              if issues:
                  summary += ["Mapping review required:"] + ["- " + issue for issue in issues]
              else:
                  summary.append("Field mapping validation completed; daily Sheets refresh is enabled.")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write("\n\n".join(summary) + "\n")
              print("Calls Data snapshot written and readback verified.")
              for issue in issues:
                  print("Mapping review: " + issue)
          
          
          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  # Suppress exception values/tracebacks that might include CRM responses.
                  print("::error::Calls refresh failed (" + type(exc).__name__ + "). Check the failed stage before rerunning.")
                  raise SystemExit(1)
          PY
